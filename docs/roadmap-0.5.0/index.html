<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pompey 0.5.0 · design proposals</title>
<style>
:root{color-scheme:dark;--bg:#090c12;--card:#111722;--line:#29313d;--text:#ecedf0;--muted:#a5aeba;--gold:#e0bb51;--green:#8dd6ab;--amber:#efc56b;--red:#f4a19c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1080px;margin:auto;padding:28px 36px 24px}header{display:flex;justify-content:space-between;align-items:center;padding-bottom:22px;border-bottom:1px solid var(--line)}.brand{font:600 25px Georgia,serif;letter-spacing:4px;color:var(--gold)}.badge,.tag{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:4px 9px;color:var(--muted)}nav{display:flex;gap:26px;margin:20px 0 27px;font-size:14px;color:var(--muted)}nav b{color:var(--gold)}.heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px}h1{font-size:25px;line-height:1.3;margin:0 0 5px;letter-spacing:-.4px}h2{font-size:16px;margin:0 0 12px}h3{font-size:14px;margin:0 0 5px}p{margin:0 0 12px}.muted,small{color:var(--muted)}small{font-size:12px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);margin-bottom:10px}.card{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:20px;margin-bottom:16px}.row{display:flex;align-items:center;justify-content:space-between;gap:16px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.grid .card{margin-bottom:0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.metric{border-right:1px solid var(--line);padding-right:16px}.metric:last-child{border:0;padding-right:0}.value{font-size:24px;font-weight:600;line-height:1.4}.label{font-size:12px;color:var(--muted)}.ok{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.dot{display:inline-block;width:7px;height:7px;border-radius:100%;background:currentColor;margin-right:7px}.notice{border:1px solid #635131;background:#221d15;border-radius:8px;padding:13px 15px;margin:16px 0}.notice p:last-child{margin:0}.danger{border-color:#6b3c3b;background:#251a1d}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}button,.button{font:500 13px system-ui;padding:9px 13px;border:1px solid #414b5b;border-radius:6px;color:var(--text);background:#202938;white-space:normal}button.primary{background:var(--gold);border-color:var(--gold);color:#14171b}button[disabled]{opacity:.45}.text-link{color:var(--gold);font-size:13px}.rule{border-top:1px solid var(--line);margin:16px 0}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{text-align:left;color:var(--muted);font-weight:400;padding:0 0 9px}.table td{padding:11px 0;border-top:1px solid var(--line)}.table td:last-child{text-align:right}.table th:last-child{text-align:right}.step{display:grid;grid-template-columns:22px 1fr auto;gap:8px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}.step:last-child{border:0}.step .icon{color:var(--green)}.step.block .icon{color:var(--amber)}.step.pending{color:var(--muted)}.field{padding:9px 11px;border:1px solid #3a4554;border-radius:6px;background:#0b1019;margin:5px 0 12px;font-size:13px}.pill{font-size:11px;padding:3px 7px;border-radius:5px;background:#202b28;color:var(--green)}.pill.warn{background:#342b1c;color:var(--amber)}.code{font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;background:#0a1018;border:1px solid var(--line);padding:13px;border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere}.fine{font-size:12px;color:var(--muted);margin-top:10px}.summaryline{font-size:13px}.breadcrumbs{font-size:12px;color:var(--muted);margin-bottom:9px}footer{border-top:1px solid var(--line);margin-top:22px;padding-top:12px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}.checks{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}.checks .step{grid-template-columns:17px 1fr auto}.tight{margin-bottom:4px}.request-title{font-size:19px;margin-bottom:5px}.timeline{margin:7px 0}.inline-counts{display:flex;gap:18px;flex-wrap:wrap}.space{margin-top:16px}
@media(max-width:700px){main{padding:20px}.metrics{grid-template-columns:1fr 1fr;gap:16px}.metric{border:0}.grid,.checks{grid-template-columns:1fr}.heading{align-items:start}header{gap:12px}.badge{max-width:180px}.table{font-size:12px}}
</style>
</head>
<body><main><header><div class="brand">POMPEY</div><span class="badge">0.5.0 design proposal · example data</span></header><nav id="nav"></nav><div id="content"></div><footer><span>Concept only · no live services or personal data</span><span>Home Assistant Ingress</span></footer></main>
<script>
const pages = {
overview: `<div class="heading"><div><h1>Overview</h1><span class="muted">Your application stack at a glance.</span></div><small>Updated 8 seconds ago</small></div>
<section class="card"><div class="metrics"><div class="metric"><div class="eyebrow">Torrents</div><div class="value">3 <span class="label">downloading</span></div><div class="label">2 seeding · 1 stalled</div></div><div class="metric"><div class="eyebrow">Monitored</div><div class="value">37 <span class="label">shows</span></div><div class="label">12 movies</div></div><div class="metric"><div class="eyebrow">Indexers</div><div class="value warn">10 / 12</div><div class="label">enabled indexers healthy</div></div><div class="metric"><div class="eyebrow">Requests</div><div class="value">4 <span class="label">open</span></div><div class="label">3 waiting · 1 needs attention</div></div></div>
<div class="notice"><div class="row"><span><span class="dot warn"></span><b>Attention:</b> 1 blocked import · 2 indexers unavailable</span><span class="text-link">Review details →</span></div></div><div class="row summaryline"><span class="ok"><span class="dot"></span>VPN connected</span><span class="muted">↓ 8.4 MB/s &nbsp; ↑ 420 KB/s</span><span class="muted">5 / 5 applications responding</span></div></section>
<div class="actions"><button class="primary">Search and requests ↗</button><button>Manage indexers ↗</button><button>Setup and connections</button></div>
<section class="card space"><div class="row"><h2 class="tight">Request and download details</h2><span class="text-link">Show all →</span></div><table class="table space"><thead><tr><th>Title</th><th>Current step</th><th>Status</th></tr></thead><tbody><tr><td>The Glass Observatory</td><td>Import</td><td class="warn">Destination not writable</td></tr><tr><td>Harbor Signals · Season 2</td><td>Download</td><td>63% · downloading</td></tr><tr><td>Winter Atlas</td><td>Search</td><td class="muted">Waiting for a suitable release</td></tr></tbody></table></section>
<p class="fine">Counts describe current state. Expand details for completed-request history, monitored episodes and individual applications.</p>`,
diagnostics: `<div class="breadcrumbs">Requests / The Glass Observatory</div><div class="heading"><div><h1>What is holding this request up?</h1><span class="muted">The Glass Observatory · Movie · Default profile</span></div><span class="tag">Updated 8 seconds ago</span></div>
<div class="grid"><section class="card"><h2>Request progress</h2><div class="timeline"><div class="step"><span class="icon">✓</span><span>Request approved</span><small>14:02</small></div><div class="step"><span class="icon">✓</span><span>Added to Radarr</span><small>14:02</small></div><div class="step"><span class="icon">✓</span><span>Suitable release selected</span><small>14:03</small></div><div class="step"><span class="icon">✓</span><span>Download verified by qBittorrent</span><small>14:11</small></div><div class="step block"><span class="icon">!</span><span>Import blocked</span><span class="warn">Needs attention</span></div><div class="step pending"><span>○</span><span>Available in the library</span><span>Pending</span></div></div><p class="fine">Library availability is separate from Plex discovery and playback.</p></section><section class="card"><span class="pill warn">Storage access</span><h2 class="space">Destination is not writable</h2><p>Radarr finished the download but cannot move it into the library.</p><div class="field">/media/library/Movies</div><p class="muted">Restore write access to the share, then retry the import. Your download is retained.</p><div class="actions"><button class="primary">Check storage</button><button>Open Radarr ↗</button></div></section></div>
<section class="card space"><div class="row"><h2 class="tight">Latest evidence</h2><small>Reported by Radarr · 14:12</small></div><p class="code space">Import failed: access to the destination path was denied.</p><p class="fine">Last checked 8 seconds ago. Unavailable observations are labelled Unknown and retain their last successful check time.</p></section>`,
recovery: `<div class="breadcrumbs">Requests / The Glass Observatory / Recovery</div><div class="heading"><div><h1>Resolve a blocked import</h1><span class="muted">Use the native application's existing workflow.</span></div></div>
<div class="grid"><section class="card"><span class="pill">Storage check passed</span><h2 class="space">Ready to retry the import</h2><p>The download is complete. The destination is writable again.</p><div class="eyebrow space">Download</div><p>The Glass Observatory · 100% verified</p><div class="eyebrow">Destination</div><div class="field">/media/library/Movies</div><p class="muted">Ask Radarr to retry this import. Matching, quality checks and file handling remain Radarr's responsibility.</p><div class="actions"><button class="primary">Retry import in Radarr</button><button>Open Radarr ↗</button></div><p class="fine">If this takes longer than expected, Pompey checks the existing operation before offering another attempt.</p></section><section class="card"><h2>Other request states</h2><div class="step"><span>⌕</span><span>No suitable release</span><span class="text-link">Search releases</span></div><div class="step"><span>…</span><span>No connected peers</span><span class="muted">Explain / open downloader</span></div><div class="step block"><span class="icon">!</span><span>Ambiguous manual download</span><span class="text-link">Review in Arr</span></div><p class="muted space">Unknown files stay available for review. Pompey does not guess a match or remove files to clear a warning.</p><div class="notice"><b>Inspect available releases</b><p class="fine">Inspect release rejection reasons first. Starting a native search that may grab a release is a separate, clearly labelled action.</p></div></section></div>`,
setup: `<div class="heading"><div><h1>Setup and connections</h1><span class="muted">Verify the path from request to library.</span></div><button>Run checks</button></div>
<section class="card"><div class="checks"><div class="step"><span class="icon">✓</span><span>VPN connection</span><span class="ok">Connected</span></div><div class="step"><span class="icon">✓</span><span>Plex connection</span><span class="ok">Authenticated</span></div><div class="step"><span class="icon">✓</span><span>Seerr → Radarr and Sonarr</span><span class="ok">Connected</span></div><div class="step block"><span class="icon">!</span><span>Plex libraries</span><span class="warn">None selected</span></div><div class="step"><span class="icon">✓</span><span>Prowlarr → both Arr applications</span><span class="ok">Synchronized</span></div><div class="step"><span class="icon">✓</span><span>Media storage</span><span class="ok">Writable</span></div></div></section>
<div class="grid"><section class="card"><h2>Select Plex libraries</h2><p>Plex is reachable, but Seerr has no libraries selected to scan for existing media.</p><p class="muted">Open Seerr → Settings → Plex, sync the library list and select your movie and TV libraries.</p><div class="actions"><button class="primary">Open Seerr Plex settings ↗</button><button>Check again</button></div><p class="fine">Tautulli is optional. The Plex section has its own Save button.</p></section><section class="card"><h2>Opening application interfaces</h2><p>Seerr and Prowlarr open on separate local-network ports.</p><p class="muted">If Home Assistant works remotely but these links do not, use local access or your configured reverse proxy.</p><div class="rule"></div><span class="ok"><span class="dot"></span>Same-host services detected automatically</span><p class="fine">Use Local network access to allow additional networks when needed.</p></section></div>
<p class="fine">Checks report what the server can establish. They cannot prove that a user's browser can reach a separate port.</p>`,
storage: `<div class="heading"><div><h1>Storage needs attention</h1><span class="muted">Share access changed after startup.</span></div><span class="tag">Last checked 8 seconds ago</span></div>
<div class="notice danger"><b class="bad">Media share unavailable</b><p>Pompey cannot verify the expected media storage. Downloads and library files are retained; review the connection before resuming affected work.</p></div>
<div class="grid"><section class="card"><h2>What failed</h2><div class="eyebrow">Media directory</div><div class="field">/media/library</div><div class="row"><span>Expected storage</span><span>SMB/CIFS share</span></div><div class="rule"></div><div class="row"><span>Current result</span><span class="bad">Expected mount not detected</span></div><p class="muted space">Writing to an ordinary directory underneath a disconnected share could put media on Home Assistant's local disk.</p><div class="notice"><b>Affected activity is paused.</b><p class="fine">New downloads and imports remain paused until the expected share is writable. Existing files are retained.</p></div></section><section class="card"><h2>Restore access</h2><p>1. Check the storage server and network connection.</p><p>2. Reconnect the share in Home Assistant storage settings.</p><p>3. Run a storage check before retrying affected work.</p><div class="actions"><button class="primary">Check storage again</button></div><p class="fine">Do not delete the downloads directory or change ownership recursively.</p><div class="rule"></div><h3>After recovery</h3><p class="muted">Report restored access and resume eligible work. Keep ambiguous imports available for review.</p></section></div>`,
vpn: `<div class="heading"><div><h1>Connection recovering</h1><span class="muted">Local applications remain available.</span></div><span class="tag">Live status</span></div>
<section class="card"><div class="row"><h2 class="tight">WireGuard VPN</h2><span class="pill warn">Reconnecting</span></div><div class="notice"><b>Internet access is blocked while the VPN is unavailable.</b><p class="fine">You can still open requests, indexers and local application settings.</p></div><div class="inline-counts"><span>3 downloads waiting for connection</span><span class="muted">2 completed files retained</span></div><div class="actions"><button class="primary">Search and requests ↗</button><button>Review VPN configuration</button></div></section>
<div class="grid"><section class="card"><h2>Recovery progress</h2><div class="step"><span class="icon">✓</span><span>Local services responding</span><span class="ok">5 / 5</span></div><div class="step"><span class="icon">✓</span><span>Fail-closed policy installed</span><span class="ok">Active</span></div><div class="step block"><span class="icon">…</span><span>VPN handshake</span><span class="warn">Waiting</span></div><div class="step pending"><span>○</span><span>Application DNS and transfer progress</span><span>Pending</span></div></section><section class="card"><h2>When the tunnel returns</h2><p>Recheck connectivity and observe existing downloads resuming.</p><p class="muted">A connected VPN does not prove that a stalled download is transferring again. Show that distinction if recovery needs attention.</p><div class="rule"></div><p class="ok"><span class="dot"></span>Recovered state: VPN connected</p><p class="fine">3 downloads resumed · verified transfer progress</p></section></div>`,
support: `<div class="heading"><div><h1>Application status and support</h1><span class="muted">Versions, recent operations and useful evidence.</span></div><span class="tag">Pompey 0.5.0</span></div>
<div class="grid"><section class="card"><h2>Bundled applications</h2><table class="table"><thead><tr><th>Application</th><th>Version</th><th>Status</th></tr></thead><tbody><tr><td>Seerr</td><td>3.5.1</td><td class="ok">Responding</td></tr><tr><td>Prowlarr</td><td>2.6.5</td><td class="warn">2 indexers unavailable</td></tr><tr><td>Radarr</td><td>6.4.4</td><td class="ok">Responding</td></tr><tr><td>Sonarr</td><td>4.0.20</td><td class="ok">Responding</td></tr><tr><td>qBittorrent</td><td>5.3.0</td><td class="ok">Responding</td></tr></tbody></table><p class="fine">Show Recyclarr, runtime and quality-resource versions →</p></section><section class="card"><h2>Last successful operations</h2><div class="step"><span class="icon">✓</span><span>Configuration checked</span><small>28 seconds ago</small></div><div class="step"><span class="icon">✓</span><span>Request synchronization</span><small>12 seconds ago</small></div><div class="step"><span class="icon">✓</span><span>Download maintenance</span><small>9 seconds ago</small></div><div class="step"><span class="icon">✓</span><span>Library routing</span><small>8 seconds ago</small></div><div class="notice"><b>Responding does not mean every request is progressing.</b><p class="fine">Open a request for its current blocker and supporting evidence.</p></div></section></div>
<section class="card space"><div class="row"><h2 class="tight">Recent attention</h2><span class="text-link">How to share logs →</span></div><p class="code space">14:12  Prowlarr  2 enabled indexers unavailable; last success 13:58.
       Same condition repeated 18 times in 6 minutes.</p><p class="fine">Home Assistant Logs contain Pompey and application output. Review for private information before manually copying and sharing. Nothing is uploaded automatically.</p></section>`
};
const view = new URLSearchParams(location.search).get('view') || 'overview';
document.getElementById('content').innerHTML = pages[view] || pages.overview;
const section = view === 'setup' ? 'Setup' : ['diagnostics','recovery'].includes(view) ? 'Requests' : view === 'support' ? 'Status' : 'Overview';
document.getElementById('nav').innerHTML = ['Overview','Requests','Setup','Status'].map(x => x === section ? `<b>${x}</b>` : `<span>${x}</span>`).join('');
</script>
</body>
</html>
