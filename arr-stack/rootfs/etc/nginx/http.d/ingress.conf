server {
    listen %%port%% default_server;
    allow 172.30.32.2;
    deny all;

    client_max_body_size 0;

    root /usr/share/arr-stack;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Native *arr ports — locations will proxy in a later version.
    # UrlBase rewrites must use $http_x_ingress_path (HA Ingress token prefix).
    location /sonarr/ {
        return 503;
    }
    location /radarr/ {
        return 503;
    }
    location /prowlarr/ {
        return 503;
    }
    location /bazarr/ {
        return 503;
    }
    location /qbittorrent/ {
        return 503;
    }
}
