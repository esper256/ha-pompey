configuration:
  wireguard_config:
    name: WireGuard config file
    description: Filename under /config/wireguard/ (the Proton-generated .conf). Used when that file exists.
  wireguard_private_key:
    name: WireGuard private key
    description: PrivateKey from the Proton config. Only needed if the file is not present.
  wireguard_address:
    name: WireGuard address
    description: Interface Address from the Proton config (for example 10.2.0.2/32).
  wireguard_peer_public_key:
    name: Peer public key
    description: Peer's PublicKey from the Proton config.
  wireguard_endpoint:
    name: Endpoint
    description: Peer's Endpoint (host:port) from the Proton config.
  wireguard_dns:
    name: WireGuard DNS
    description: Tunnel DNS/gateway. Proton WireGuard uses 10.2.0.1. Also the NAT-PMP gateway.
  port_forwarding:
    name: Port forwarding
    description: Renew a Proton NAT-PMP mapping and later push it to qBittorrent.
  lan_networks:
    name: LAN networks
    description: CIDRs that may bypass the VPN (local media servers). Supervisor's 172.30.32.0/23 is always included.
  enable_qbittorrent:
    name: Enable qBittorrent
    description: Download client. Skeleton does not start it yet.
  enable_prowlarr:
    name: Enable Prowlarr
    description: Indexer manager. Skeleton does not start it yet.
  enable_sonarr:
    name: Enable Sonarr
    description: TV automation. Skeleton does not start it yet.
  enable_radarr:
    name: Enable Radarr
    description: Movie automation. Skeleton does not start it yet.
  enable_bazarr:
    name: Enable Bazarr
    description: Subtitles. Skeleton does not start it yet.
  connection_mode:
    name: Connection mode
    description: ingress_noauth uses Home Assistant login only. Do not expose the optional LAN port to the internet in that mode.
  log_level:
    name: Log level
    description: Verbosity for nginx and VPN scripts.
network:
  8089/TCP: Optional LAN launcher (same UI as Ingress). Leave unmapped unless you need it.
