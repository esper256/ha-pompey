name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: options.json tests (no HAOS)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Install WireGuard tools
        run: sudo apt-get update && sudo apt-get install -y wireguard-tools iproute2

      # options.json + stubs + fake-wg0 smoke + generated WireGuard handshake.
      # Never start a torrent client. Never needs Proton.
      - name: Run tests
        run: bash tests/run.sh
