name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: options.json tests (no HAOS)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Cache Servarr artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/pompey
          key: pompey-servarr-${{ runner.os }}

      # options.json + stubs + fake-wg0 smoke + real Prowlarr unpack.
      # Never start a torrent client. Never needs Proton.
      - name: Run tests
        run: bash tests/run.sh
