name: Test
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: python3 tools/ci_scope.py

  acceptance:
    name: Real household journey and isolated packets
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Restore build layers
        uses: actions/cache@v5
        with:
          path: /tmp/pompey-build-cache
          key: pompey-build-${{ runner.os }}-${{ hashFiles('pompey/Dockerfile', 'pompey/vendor_bundle.py', 'pompey/rootfs/usr/share/pompey/engines.json', 'tests/journey/Dockerfile') }}
      - name: Build the shipped amd64 image once
        run: |
          docker buildx create --use --driver docker-container
          docker buildx build --load --platform linux/amd64 \
            --build-arg BUILD_ARCH=amd64 --build-arg BUILD_VERSION=0.4.0 --build-arg BUILD_REF="$GITHUB_SHA" \
            --cache-from type=local,src=/tmp/pompey-build-cache \
            --cache-to type=local,dest=/tmp/pompey-build-cache-new,mode=max \
            -t localhost/pompey:foundation pompey/
          rm -rf /tmp/pompey-build-cache
          mv /tmp/pompey-build-cache-new /tmp/pompey-build-cache
      - name: Focused logic, required packets and the real request-to-library journey
        run: bash tests/run.sh --skip-build --layout ci --exclude vpn-download-loss
        env:
          POMPEY_CONTAINER_COMMAND: docker
      - name: Preserve required acceptance summary
        run: cp .test-results/timing-summary.json .test-results/required-timing-summary.json
      - name: Advisory known issue — VPN download resumption
        continue-on-error: true
        run: bash tests/run.sh --skip-build --journey-only --only vpn-download-loss
        env:
          POMPEY_CONTAINER_COMMAND: docker
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: household-journey
          include-hidden-files: true
          path: .test-results/

  required:
    name: CI required
    if: always()
    needs: [changes, acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every selected check
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          jobs = json.loads(os.environ['NEEDS'])
          assert jobs['changes']['result'] == 'success', jobs
          code = jobs['changes']['outputs']['code']
          assert code in {'true', 'false'}, jobs
          expected = 'success' if code == 'true' else 'skipped'
          assert jobs['acceptance']['result'] == expected, jobs
          PYTHON

  candidate:
    name: Current stable upstream candidate (no promotion during foundation)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Resolve stable releases and pinned resources
        run: python3 tools/build_engine_manifest.py pompey/rootfs/usr/share/pompey/engines.json
      - name: Build and exercise the candidate's actual applications
        run: bash tests/run.sh --layout ci
        env:
          POMPEY_CONTAINER_COMMAND: docker
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: candidate-journey
          include-hidden-files: true
          path: |
            .test-results/
            pompey/rootfs/usr/share/pompey/engines.json
