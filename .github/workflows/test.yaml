name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: options.json tests (no HAOS)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      # options.json + stubs + fake-wg0 smoke only. Never start a torrent client.
      - name: Run tests
        run: bash tests/run.sh
