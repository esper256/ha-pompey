name: Build app

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      name: ${{ steps.normalize.outputs.name }}
      description: ${{ steps.normalize.outputs.description }}
      url: ${{ steps.normalize.outputs.url }}
      version: ${{ steps.normalize.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Get app information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ inputs.app }}"

      - name: Normalize app information
        id: normalize
        env:
          APP_VERSION: ${{ steps.info.outputs.version }}
          APP_NAME: ${{ steps.info.outputs.name }}
          APP_DESCRIPTION: ${{ steps.info.outputs.description }}
          APP_URL: ${{ steps.info.outputs.url }}
        run: |
          trim_quotes() {
            local s="$1"
            if [[ "${s}" == \"*\" ]]; then
              s="${s:1:${#s}-2}"
            fi
            printf '%s' "${s}"
          }
          APP_VERSION="$(trim_quotes "${APP_VERSION}")"
          APP_NAME="$(trim_quotes "${APP_NAME}")"
          APP_DESCRIPTION="$(trim_quotes "${APP_DESCRIPTION}")"
          APP_URL="$(trim_quotes "${APP_URL}")"
          {
            echo "image_name=pompey"
            echo "version=${APP_VERSION}"
            echo "name=${APP_NAME}"
            echo "description<<DESC"
            printf '%s\n' "${APP_DESCRIPTION}"
            echo "DESC"
          } >> "$GITHUB_OUTPUT"
          if [[ -n "${APP_URL}" && "${APP_URL}" != "null" ]]; then
            echo "url=${APP_URL}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: pompey
          registry-prefix: local

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: "./${{ inputs.app }}"
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
          labels: |
            io.hass.type=addon
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            ${{ needs.prepare.outputs.url && format('io.hass.url={0}', needs.prepare.outputs.url) || '' }}
          push: false
          version: ${{ needs.prepare.outputs.version }}
