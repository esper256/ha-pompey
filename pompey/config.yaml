# https://developers.home-assistant.io/docs/apps/configuration
name: Pompey
version: "0.6.2"
slug: pompey
description: >-
  Request and organize movies and TV series, with downloads
  and internet access protected by a WireGuard VPN.
url: https://github.com/esper256/ha-pompey/tree/main/pompey
arch:
  - amd64
init: false
stage: experimental
breaking_versions:
  - "0.4.0"
# Docker start/stop wait. Supervisor Range(min=10, max=300); over 300 skips the app.
timeout: 300
startup: application
boot: auto
backup: cold
backup_exclude:
  - "*/logs/*"
panel_icon: mdi:magnify
panel_title: Pompey
panel_admin: false
ingress: true
ingress_port: 8099
ingress_stream: true
# Search is Seerr on this host port. Sources (Prowlarr) are published too —
# Seerr cannot add indexers. Ingress stays Pompey's wait/status UI.
# Plex is a separate app; Pompey does not run it. Radarr/Sonarr/qbit stay
# localhost unless Debug is on — then Ingress links those three Web UIs.
ports:
  5055/tcp: 5055
  9696/tcp: 9696
ports_description:
  5055/tcp: Search and requests (Seerr)
  9696/tcp: Indexer management (Prowlarr)
apparmor: true
privileged:
  - NET_ADMIN
devices:
  - /dev/net/tun
map:
  - type: addon_config
    read_only: false
  - type: share
    read_only: false
  - type: media
    read_only: false
# Library paths are relative to media_folder. Existing directory names are
# retained as defaults for configuration compatibility. Plex scans the final
# library directories; downloads remain outside the Plex libraries.
options:
  media_folder: /media/dlna
  movies_folder: Movies/Not Kid Friendly
  movies_kid_folder: Movies/Kid Friendly
  tv_folder: TV/Not Kid Friendly
  tv_kid_folder: TV/Kid Friendly
  debug: false
  nat_pmp_gateway: ""
  lan_networks: ""
schema:
  media_folder: str
  movies_folder: str
  movies_kid_folder: str
  tv_folder: str
  tv_kid_folder: str
  # Legacy values are read until preferences are saved in Ingress.
  after_download: list(stop_sharing|share_to_ratio|share_one_day)?
  simultaneous_downloads: int(1,20)?
  debug: bool
  nat_pmp_gateway: str
  lan_networks: str
