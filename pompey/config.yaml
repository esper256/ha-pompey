# https://developers.home-assistant.io/docs/apps/configuration
name: Pompey
version: "0.2.19"
slug: pompey
description: >-
  Search for a movie or TV show. Confirm if we need you. It lands in the
  right library and Plex notices. All internet from this app uses Proton
  WireGuard; if the tunnel is down, internet is dropped.
url: https://github.com/esper256/ha-pompey/tree/main/pompey
arch:
  - aarch64
  - amd64
init: false
stage: experimental
# Docker start/stop wait. Supervisor Range(min=10, max=300); over 300 skips the app.
timeout: 300
startup: application
boot: auto
panel_icon: mdi:magnify
panel_title: Pompey
panel_admin: false
ingress: true
ingress_port: 8099
ingress_stream: true
# Search is Seerr on this host port. Sources (Prowlarr) are published too —
# Seerr cannot add indexers. Ingress stays Pompey's wait/status UI.
# Plex is a separate app; Pompey does not run it. Radarr/Sonarr/qbit stay
# localhost.
ports:
  5055/tcp: 5055
  9696/tcp: 9696
ports_description:
  5055/tcp: Search (Seerr). Not Plex.
  9696/tcp: Sources (Prowlarr). Not Radarr/Sonarr.
apparmor: true
privileged:
  - NET_ADMIN
devices:
  - /dev/net/tun
map:
  - type: addon_config
    read_only: false
  - type: share
    read_only: false
  - type: media
    read_only: false
# Plex is Seerr's wizard. Sources are Prowlarr on :9696. Proton is
# wait-screen paste. Re-add a field here only when the household must
# answer it in Home Assistant.
options: {}
schema: {}
