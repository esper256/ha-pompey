<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pompey</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07090d;
      --fg: #ece8e1;
      --muted: #9a948a;
      --line: #2a2d36;
      --focus: #d4af37;
      --err: #e08a7a;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }

    main {
      width: min(36rem, 100%);
    }

    h1 {
      margin: 0 0 1.35rem;
    }

    h1 img {
      display: block;
      width: min(36rem, 100%);
      height: auto;
    }

    p, li {
      margin: 0;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.95rem;
      line-height: 1.55;
      color: var(--muted);
    }

    .bar {
      height: 0.35rem;
      background: var(--line);
      border-radius: 99px;
      overflow: hidden;
      margin: 0 0 1.25rem;
    }

    .bar > span {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--focus);
      transition: width 0.4s ease;
    }

    ol {
      list-style: none;
      padding: 0;
      margin: 0 0 1.25rem;
    }

    li {
      display: grid;
      grid-template-columns: 1.25rem 1fr;
      gap: 0.6rem;
      margin-top: 0.45rem;
    }

    li .mark {
      color: var(--line);
    }

    li.active { color: var(--fg); }
    li.active .mark { color: var(--focus); }
    li.done { color: var(--fg); }
    li.done .mark { color: var(--focus); }
    li.error { color: var(--err); }
    li.error .mark { color: var(--err); }

    .now {
      color: var(--fg);
    }

    .error {
      color: var(--err);
      margin-top: 0.75rem;
    }

    #proton {
      margin-top: 1.25rem;
    }

    #proton label {
      display: block;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.95rem;
      color: var(--fg);
      margin-bottom: 0.5rem;
    }

    #proton textarea {
      width: 100%;
      min-height: 11rem;
      margin: 0 0 0.75rem;
      padding: 0.75rem;
      border: 1px solid var(--line);
      border-radius: 0.4rem;
      background: #10141c;
      color: var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.8rem;
      line-height: 1.4;
      resize: vertical;
    }

    #proton button {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.95rem;
      background: var(--focus);
      color: #07090d;
      border: 0;
      border-radius: 0.35rem;
      padding: 0.55rem 1rem;
      cursor: pointer;
    }

    #proton button:disabled {
      opacity: 0.6;
      cursor: wait;
    }
  </style>
</head>
<body>
  <main>
    <h1><img src="logo.png" width="1983" height="793" alt="Pompey"></h1>
    <div class="bar" aria-hidden="true"><span id="fill"></span></div>
    <ol id="steps"></ol>
    <p class="now" id="now">Bringing the fleet to heel…</p>
    <form id="proton" hidden>
      <label for="wg">Paste the Proton WireGuard file you downloaded (.conf). Pompey reads Endpoint and keys from that file.</label>
      <textarea id="wg" name="config" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
      <button type="submit" id="wg-go">Start the tunnel</button>
    </form>
    <p id="file-hint" hidden>This file is only the wait screen. On Home Assistant it lives in the sidebar after Proton is up. In this repo run <code>python3 tests/preview.py</code> to watch progress here.</p>
    <p class="error" id="err" hidden></p>
  </main>
  <script>
    const fileHint = document.getElementById("file-hint");
    const fill = document.getElementById("fill");
    const now = document.getElementById("now");
    const err = document.getElementById("err");
    const stepsEl = document.getElementById("steps");
    const proton = document.getElementById("proton");
    const wg = document.getElementById("wg");
    const wgGo = document.getElementById("wg-go");
    const marks = { pending: "·", active: "›", done: "✓", error: "!" };

    if (location.protocol === "file:") {
      fileHint.hidden = false;
    }

    function render(data) {
      fill.style.width = Math.max(0, Math.min(100, data.percent || 0)) + "%";
      now.textContent = data.label || "Bringing the fleet to heel…";
      proton.hidden = !data.need_proton;
      if (data.error) {
        err.hidden = false;
        err.textContent = data.error;
      } else if (!data.need_proton) {
        err.hidden = true;
        err.textContent = "";
      }
      stepsEl.replaceChildren();
      (data.steps || []).forEach((step) => {
        const li = document.createElement("li");
        li.className = step.state || "pending";
        const mark = document.createElement("span");
        mark.className = "mark";
        mark.textContent = marks[step.state] || "·";
        const lab = document.createElement("span");
        lab.textContent = step.label || step.id;
        li.append(mark, lab);
        stepsEl.append(li);
      });
      if (data.search && !data.need_proton) {
        now.textContent = "Opening search…";
        const n = Number(sessionStorage.getItem("pompey-handoff") || "0");
        if (n < 8) {
          sessionStorage.setItem("pompey-handoff", String(n + 1));
          setTimeout(() => {
            location.replace(location.pathname + location.hash);
          }, 300);
        }
      }
    }

    proton.addEventListener("submit", async (event) => {
      event.preventDefault();
      wgGo.disabled = true;
      err.hidden = true;
      try {
        const res = await fetch("setup/proton", {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: wg.value,
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok || body.ok === false) {
          err.hidden = false;
          err.textContent = body.error || "Could not use that Proton file.";
          return;
        }
        proton.hidden = true;
        now.textContent = "Starting the Proton tunnel…";
      } catch (_exc) {
        err.hidden = false;
        err.textContent = "Could not send the Proton file. Try again from the sidebar.";
      } finally {
        wgGo.disabled = false;
      }
    });

    async function tick() {
      if (location.protocol === "file:") return;
      try {
        const res = await fetch("status.json", { cache: "no-store" });
        if (!res.ok) return;
        render(await res.json());
      } catch (_exc) {
        now.textContent = "Waiting for the box to start…";
      }
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
