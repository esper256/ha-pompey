<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="5">
  <title>Pompey</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #12141a;
      --fg: #ece8e1;
      --muted: #9a948a;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }

    main {
      width: min(36rem, 100%);
    }

    h1 {
      font-weight: 600;
      font-size: 1.15rem;
      letter-spacing: 0.04em;
      margin: 0 0 1.25rem;
    }

    p {
      margin: 0;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.95rem;
      line-height: 1.55;
      color: var(--muted);
    }

    p + p {
      margin-top: 0.75rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Pompey</h1>
    <p>Bringing the fleet to heel…</p>
    <p>Search appears here when the box is ready. The first start downloads the household UI and hidden engines through the tunnel and can take several minutes.</p>
  </main>
</body>
</html>
