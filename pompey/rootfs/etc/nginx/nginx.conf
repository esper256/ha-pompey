worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Combined logs the User-Agent on every line. Status polls fire once a second.
    log_format pompey '[$time_local] $remote_addr "$request" $status $body_bytes_sent';
    map $uri $pompey_accesslog {
        default           1;
        /status.json      0;
        /logo.png         0;
        /favicon.ico      0;
    }
    access_log /dev/stdout pompey if=$pompey_accesslog;
    sendfile on;
    keepalive_timeout 65;

    include /etc/nginx/http.d/*.conf;
}
