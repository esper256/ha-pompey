configuration:
  media_folder:
    name: Media folder
    description: >-
      Folder this app can write, from Home Assistant’s point of view.
      Default /media/dlna (a network share added under Settings →
      System → Storage as Media named dlna). In-progress downloads go
      in downloads/ under this folder. Point Plex at the library
      folders below, not at downloads.
  movies_folder:
    name: Movies
    description: >-
      General movies, relative to the media folder. Default
      Movies/Not Kid Friendly. Do not nest this inside the kid movies
      folder (Radarr cannot use a root folder that contains another).
  movies_kid_folder:
    name: Kid movies
    description: >-
      Kid movies, relative to the media folder. Default Movies/Kid
      Friendly. Adults who should also see kid titles can add this
      folder to the adult Plex movie library as a second location.
  tv_folder:
    name: TV
    description: >-
      General TV, relative to the media folder. Default
      TV/Not Kid Friendly.
  tv_kid_folder:
    name: Kid TV
    description: >-
      Kid TV, relative to the media folder. Default TV/Kid Friendly.
  after_download:
    name: After a title is in the library
    description: >-
      Sharing finished torrents uses RAM and CPU in this app. Stop sharing
      (the default) removes the torrent once the file is in your library.
      Share to 1.0 ratio or for one day if you want to give a little back.
      The library file is kept either way.
  preferred_language:
    name: Preferred language
    description: >-
      Prefer English-dubbed releases, or leave original audio as-is. This
      scores the release name (English Dub, Dual Audio). It is not a
      per-request language picker in search — Seerr does not have one.
  anime_audio:
    name: Anime audio
    description: >-
      Dual audio (Japanese plus English on the same file) is the default.
      Original prefers the native track. English prefers a dub. Same
      scoring as above: the file name, not a track picker inside the file.
  subtitles:
    name: Subtitles
    description: >-
      Prefer releases that advertise English subtitles. This does not
      download missing subtitles after the file lands (that would be
      Bazarr, later). Choose none if you do not want that bias.
