configuration:
  wireguard_config:
    name: WireGuard config file
    description: Filename under /config/wireguard/ (the Proton-generated .conf). Used when that file exists.
  wireguard_private_key:
    name: WireGuard private key
    description: PrivateKey from the Proton config. Only needed if the file is not present.
  wireguard_address:
    name: WireGuard address
    description: Interface Address from the Proton config (for example 10.2.0.2/32).
  wireguard_peer_public_key:
    name: Peer public key
    description: Peer's PublicKey from the Proton config.
  wireguard_endpoint:
    name: Endpoint
    description: Peer's Endpoint (host:port) from the Proton config.
  wireguard_dns:
    name: WireGuard DNS
    description: Tunnel DNS/gateway. Proton WireGuard uses 10.2.0.1. Also the NAT-PMP gateway.
  port_forwarding:
    name: Port forwarding
    description: Ask Proton for a forwarded port so downloads can accept incoming connections.
  lan_networks:
    name: LAN networks
    description: Home CIDRs that may talk to this app without the VPN (Plex, NAS). Supervisor's 172.30.32.0/23 is always included.
  log_level:
    name: Log level
    description: Verbosity for the app and VPN scripts.
