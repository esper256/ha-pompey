configuration:
  media_folder:
    name: Media directory
    description: >-
      Writable base directory for downloads and media libraries, as mounted
      in Home Assistant. The default is /media/dlna. Configure network storage
      under Settings → System → Storage before using it here. Add only the
      library directories to Plex; exclude the downloads subdirectory.
  movies_folder:
    name: "Movies: general"
    description: >-
      General movie library, relative to the media directory. Automatic
      routing sends movies with other or unavailable age ratings here.
      The default is Movies/Not Kid Friendly. Library directories must not
      overlap or contain one another.
  movies_kid_folder:
    name: "Movies: lower age ratings"
    description: >-
      Movie library for G, PG and PG-13 titles when automatic rating-based
      routing is selected. The path is relative to the media directory;
      the default is Movies/Kid Friendly. Add this directory as a separate
      Plex library or as an additional location in an existing movie library.
  tv_folder:
    name: "TV: general"
    description: >-
      General TV library, relative to the media directory. Automatic
      routing sends series with other or unavailable age ratings here.
      The default is TV/Not Kid Friendly. Library directories must not
      overlap or contain one another.
  tv_kid_folder:
    name: "TV: lower age ratings"
    description: >-
      TV library for TV-Y, TV-Y7, TV-G and TV-PG series when automatic
      rating-based routing is selected. The path is relative to the media
      directory; the default is TV/Kid Friendly. Add this directory as a
      separate Plex library or as an additional location in an existing TV library.
  after_download:
    name: Torrent seeding policy
    description: >-
      Choose whether completed torrents stop seeding immediately, seed to
      a 1.0 upload/download ratio, or seed for 24 hours. Stop sharing is
      the default. Radarr or Sonarr imports the media and removes the torrent after
      import and the selected seeding target. Imported library files are
      retained. Continued seeding requires hardlinks or an additional file copy.
  simultaneous_downloads:
    name: Active download limit
    description: >-
      Maximum number of active downloads, from 1 to 20. The default is 8.
      Slow and stalled torrents are excluded according to qBittorrent activity thresholds. Increase the limit to allow more
      transfers to run concurrently. Restart Pompey after changing this setting.
  debug:
    name: Advanced application interfaces
    description: >-
      Show links to the Radarr, Sonarr and qBittorrent web interfaces in
      the Pompey sidebar. Access uses authenticated Home Assistant Ingress;
      these interfaces are not published on the local network. Disabled by
      default. Restart Pompey after changing this setting.
  nat_pmp_gateway:
    name: NAT-PMP gateway
    description: >-
      Optional numeric gateway address supplied by a VPN provider that
      supports NAT-PMP port forwarding. Leave empty to disable port
      forwarding. Use the provider's gateway address, not a DNS server address.
  lan_networks:
    name: Local network access
    description: >-
      Comma-separated network ranges that Pompey may access directly,
      such as 192.168.1.0/24 for a local Plex server or indexer. Leave empty
      if direct local network access is not required. Internet access and
      application DNS continue to use the VPN.
