configuration:
  plex_url:
    name: Plex address
    description: >-
      Numeric IP where Plex listens, for example http://192.168.1.10:32400
      or http://172.30.32.1:32400 if Plex is on this same Home Assistant machine.
      Hostnames will not resolve through Proton DNS.
  plex_token:
    name: Plex token
    description: >-
      Token from the Plex account that owns the server. Open any item on that
      server in a browser, View Source, search for X-Plex-Token.
  source_url:
    name: Source URL
    description: Base URL of one source. Pompey does not ship a catalog; you provide this.
  source_key:
    name: Source key
    description: API key for that source.
